<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff3d9a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="description" content="Blogum — PWA intégrée à KeffStation : Mur, Réels/Story et Profil Blog-Forum configurable.">
<title>Blogum — Mur, Réels/Story, Profil</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="https://raw.githubusercontent.com/samuelhaihornberg/keffstation/faf852a98bfec55a20c5bcbec2b15c19da72b980/1794400646339.jpg">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/samuelhaihornberg/keffstation/faf852a98bfec55a20c5bcbec2b15c19da72b980/1794400646339.jpg">
<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="./style.css">
</head>
<body class="blogum-app">
  <nav class="apps-nav">
    <a href="../" class="app-link app-home">← KeffStation</a>
    <a href="../kifftech.store/" class="app-link">🛒 Kifftech.store</a>
    <a href="../viartificial-labs/" class="app-link">🤖 ViArtificial-Labs</a>
    <a href="../videogames/" class="app-link">🎮 Videogames</a>
    <a href="./" class="app-link app-active">📝 Blogum</a>
  </nav>

  <header class="blogum-header">
    <div class="blogum-header-inner">
      <div class="blogum-top">
        <div class="blogum-brand">
          <img src="https://raw.githubusercontent.com/samuelhaihornberg/keffstation/faf852a98bfec55a20c5bcbec2b15c19da72b980/1794400646339.jpg" alt="Logo Blogum" width="36" height="36">
          <h1>Blogum</h1>
        </div>
        <div class="blogum-badge">PWA intégrée · KeffStation</div>
      </div>
      <nav id="viewTabs" class="view-tabs" role="tablist" aria-label="Vues Blogum"></nav>
      <p class="swipe-hint">Touchez un sélecteur ou glissez à gauche/droite pour changer de vue.</p>
    </div>
  </header>

  <main class="blogum-shell">
    <div class="views-viewport" id="viewsViewport">
      <div class="views-track" id="viewsTrack">
        <section class="view-panel" id="view-mur" role="tabpanel" aria-labelledby="tab-mur"></section>
        <section class="view-panel" id="view-reels" role="tabpanel" aria-labelledby="tab-reels"></section>
        <section class="view-panel" id="view-profil" role="tabpanel" aria-labelledby="tab-profil"></section>
      </div>
    </div>
  </main>

  <script src="./app.js"></script>
  <script src="./clear-cache.js"></script>
  <script defer src="../page-transition.js"></script>
</body>
</html>
