# Configuration Supabase (utilisée par la CLI sur ordinateur ou en CI).
# Sur Android/Termux, la CLI n'est pas disponible : utiliser l'interface web.

project_id = "kiffstationadmin"

[functions.ingest]
# La PWA publique ne doit envoyer aucun jeton.
# La protection repose sur la validation stricte du payload,
# le filtrage des robots et la limitation par session.
verify_jwt = false
