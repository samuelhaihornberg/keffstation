# Supabase CLI — fonctions de paiement KiffTech.
# verify_jwt = false : le navigateur (panier public, sans compte) appelle les fonctions avec la clé publishable,
# qui n'est pas un JWT utilisateur. La protection est assurée par les fonctions elles-mêmes :
# origine exacte (PUBLIC_SITE_ORIGIN), limitation de débit, recalcul serveur, jeton de commande, capture confirmée.
[functions.paypal-config]
verify_jwt = false

[functions.paypal-create-order]
verify_jwt = false

[functions.paypal-capture-order]
verify_jwt = false
