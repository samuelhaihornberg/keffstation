<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0066ff">
<meta name="description" content="Éditeur COS : syntaxe <cos>, <co>, balises <script_…> et CSS alphanumérique. Analyse locale, aperçu SPA, tutoriels et export JSON. PWA offline-first.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='65' font-size='60' text-anchor='middle'%3E🧩%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./editor.css">
<title>Éditeur COS — Analyse, Aperçu et Tutoriels</title>
</head>
<body>
<div class="app">
  <header class="entete">
    <div class="marque">
      <span class="logo" aria-hidden="true">🧩</span>
      <div>
        <h1>Éditeur COS</h1>
        <p>Syntaxe <code><cos></code> · <code><co></code> · <code><script_…></code> · CSS alphanumérique</p>
      </div>
    </div>
    <div class="entete-actions">
      <span id="statut" class="statut" data-niveau="info" role="status" aria-live="polite">Initialisation…</span>
      <button type="button" id="btn-defaut" class="btn">cos-defaut (118)</button>
      <button type="button" id="btn-exemple" class="btn">Exemple</button>
      <button type="button" id="btn-effacer" class="btn">Effacer</button>
      <button type="button" id="btn-tutoriel" class="btn">Tutoriel</button>
    </div>
  </header>

  <main class="atelier">
    <section class="panneau panneau-source" aria-labelledby="titre-source">
      <div class="panneau-tete">
        <h2 id="titre-source">Source COS</h2>
        <span id="compteur-source" class="compteur">0 ligne</span>
      </div>
      <div class="zone-editeur">
        <div id="gouttiere" class="gouttiere" aria-hidden="true">1</div>
        <textarea id="source" class="source" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Source COS"></textarea>
      </div>
      <div class="barre-actions">
        <button type="button" id="btn-analyser" class="btn primaire">Analyser</button>
        <button type="button" id="btn-copier" class="btn">Copier JSON</button>
        <button type="button" id="btn-telecharger" class="btn">Télécharger JSON</button>
      </div>
      <p class="note-runtime">Les balises <code><script_…></code> (NOUVEAU, à confirmer) sont des opérandes typés : l'éditeur les analyse, ne les exécute jamais.</p>
    </section>

    <section class="panneau panneau-resultats" aria-labelledby="titre-resultats">
      <div class="panneau-tete">
        <h2 id="titre-resultats">Résultats</h2>
        <div id="stats" class="stats" aria-live="polite"></div>
      </div>
      <div class="onglets" role="tablist" aria-label="Vues des résultats">
        <button type="button" class="onglet actif" data-vue="apercu" role="tab" aria-selected="true" aria-controls="vue-apercu">Aperçu</button>
        <button type="button" class="onglet" data-vue="liens" role="tab" aria-selected="false" aria-controls="vue-liens">Liens <span id="badge-liens" class="badge-onglet">0</span></button>
        <button type="button" class="onglet" data-vue="diagnostics" role="tab" aria-selected="false" aria-controls="vue-diagnostics">Diagnostics <span id="badge-diags" class="badge-onglet">0</span></button>
        <button type="button" class="onglet" data-vue="css" role="tab" aria-selected="false" aria-controls="vue-css">CSS <span id="badge-css" class="badge-onglet">0</span></button>
        <button type="button" class="onglet" data-vue="tutoriel" role="tab" aria-selected="false" aria-controls="vue-tutoriel">Tutoriel <span id="badge-tuto" class="badge-onglet">?</span></button>
      </div>
      <div class="vues">
        <div id="vue-apercu" class="vue" role="tabpanel">
          <main id="apercu" class="apercu" role="main" aria-label="Aperçu SPA du document COS"></main>
        </div>
        <div id="vue-liens" class="vue" role="tabpanel" hidden>
          <div id="liste-liens" class="liste-liens"></div>
        </div>
        <div id="vue-diagnostics" class="vue" role="tabpanel" hidden>
          <div id="liste-diagnostics" class="liste-diagnostics"></div>
        </div>
        <div id="vue-css" class="vue" role="tabpanel" hidden>
          <div id="liste-css" class="liste-css"></div>
        </div>
        <div id="vue-tutoriel" class="vue" role="tabpanel" hidden>
          <div id="conteneur-tutoriel" class="conteneur-tutoriel"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="pied">COS · analyse locale dans le navigateur · aucun script personnalisé exécuté</footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>window.module={exports:{}};</script>
<script src="../viartificial-labs/src/cos-registre.js"></script>
<script>window.COSRegistre=window.module.exports;window.module={exports:{}};</script>
<script src="../viartificial-labs/src/cos-defaut.js"></script>
<script>window.COSDefaut=window.module.exports;window.module={exports:{}};</script>
<script src="../viartificial-labs/src/cos-langage.js"></script>
<script>window.COSLangage=window.module.exports;</script>
<script src="./editor.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){})}</script>
<script src="../refresh.js"></script>
</body>
</html>
