<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070816">
<meta name="description" center="Articles KeffStation — guides et documentation, disponibles en français et anglais">
<title>Articles & Guides — KeffStation</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='65' font-size='60' text-anchor='middle'%3E📄%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./vitrine.css">
<script defer src="./i18n.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { color-scheme: dark; }
html, body { height: 100%; min-height: 100dvh; background: #070816; color: #f4f6ff; font: 16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow-x: clip; }
.app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
header { padding: clamp(16px,4vh,24px) clamp(12px,3vw,20px); background: rgba(10,12,34,.9); border-bottom: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 12px; flex-shrink: 0; position: sticky; top: 0; z-index: 10; }
.logo { font-size: clamp(24px,5vw,32px); }
h1 { font-size: clamp(1.2rem,3vw,1.8rem); font-weight: 700; background: linear-gradient(90deg,#1e6bff,#00d4ff,#27d17f); -webkit-background-clip: text; background-clip: text; color: transparent; flex: 1; }
.back-link { flex-shrink: 0; font-size: .85rem; color: #ffd23f; text-decoration: none; border: 1px solid rgba(255,210,63,.5); border-radius: 999px; padding: 10px 16px; min-height: 44px; display: inline-flex; align-items: center; }
main { flex: 1; width: 100%; max-width: 900px; margin: 0 auto; padding: clamp(16px,3vw,24px); padding-bottom: max(clamp(24px,5vw,48px), env(safe-area-inset-bottom)); }
article { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: clamp(16px,3vw,20px); margin-bottom: 20px; }
article h2 { font-size: clamp(1.3rem,4vw,2rem); margin-bottom: 8px; color: #ffd23f; }
article .meta { font-size: .85rem; color: #8a92b8; margin-bottom: 12px; display: flex; gap: 12px; flex-wrap: wrap; }
article .meta span { display: flex; align-items: center; gap: 6px; }
article .content { line-height: 1.7; white-space: pre-wrap; }
article .content h1, article .content h2, article .content h3 { margin: 18px 0 8px; color: #f4f6ff; }
article .content h1 { font-size: 1.5rem; }
article .content h2 { font-size: 1.25rem; }
article .content h3 { font-size: 1.1rem; }
article .content p { margin: 10px 0; }
article .content code { background: rgba(255,255,255,.08); padding: 2px 6px; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: .9em; }
article .content pre { background: rgba(0,0,0,.3); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 12px 0; }
article .content pre code { background: transparent; padding: 0; }
article .content ul, article .content ol { margin: 8px 0 8px 20px; }
article .content li { margin: 4px 0; }
.lang-switch { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
.lang-btn { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15); color: #f4f6ff; padding: 8px 14px; border-radius: 999px; font-size: .85rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.lang-btn.active { background: rgba(255,210,63,.18); color: #ffd23f; border-color: #ffd23f; }
.lang-btn:hover { background: rgba(255,255,255,.12); }
.original-badge { font-size: .75em; opacity: .7; margin-left: 6px; text-transform: uppercase; letter-spacing: .05em; }
.translated-badge { color: #ffd23f; font-size: .75em; margin-left: 6px; text-transform: uppercase; letter-spacing: .05em; }
.empty-state { text-align: center; padding: 40px 20px; color: #8a92b8; }
.empty-state p { margin-top: 8px; }
@media (max-width: 600px) {
  header { flex-direction: column; align-items: flex-start; gap: 8px; }
  .back-link { align-self: flex-start; }
}
</style>
</head>
<body>
<div class="app">
<header>
  <span class="logo" aria-hidden="true">📄</span>
  <h1>Articles & Guides</h1>
  <a class="back-link" href="./">← Retour KeffStation</a>
</header>
<main>
  <div id="articles-list">
    <div class="empty-state">
      <p>Chargement des articles…</p>
    </div>
  </div>
</main>
</div>
<script>
(function () {
  "use strict";

  var ARTICLES = [
    {
      id: "keffstation-guide",
      fr: "./content/articles/keffstation-guide.md",
      en: "./content/articles/keffstation-guide.en.md",
      title_fr: "KeffStation: Guide complet de la vitrine smart tech",
      title_en: "KeffStation: Complete guide to the smart tech showcase"
    },
    {
      id: "cos-language-guide",
      fr: "./content/articles/cos-language-guide.md",
      en: "./content/articles/cos-language-guide.en.md",
      title_fr: "COS Language: Guide complet des balises `<script_...>`",
      title_en: "COS Language: Complete guide to `<script_...>` tags"
    },
    {
      id: "pwa-seo-guide",
      fr: "./content/articles/pwa-seo-guide.md",
      en: "./content/articles/pwa-seo-guide.en.md",
      title_fr: "SEO Technique pour les PWA: Guide KeffStation",
      title_en: "Technical SEO for PWAs: KeffStation Guide"
    }
  ];

  var listEl = document.getElementById("articles-list");
  var currentLang = (typeof ksI18nLocales !== "undefined" && ksI18nLocales.getLang) ? ksI18nLocales.getLang() : "fr";

  function render() {
    listEl.innerHTML = "";
    ARTICLES.forEach(function (a) {
      var articleEl = document.createElement("article");
      var title = (currentLang === "en") ? a.title_en : a.title_fr;
      var langBadge = (currentLang === "en") ? '<span class="translated-badge">traduit</span>' : '<span class="original-badge">original</span>';
      articleEl.innerHTML = '\
        <h2>' + escapeHtml(title) + ' ' + langBadge + '</h2>\
        <div class="meta">\
          <span>📄 ' + a.id + '</span>\
          <span id="lang-label-' + a.id + '"></span>\
        </div>\
        <div class="content" id="content-' + a.id + '">Chargement…</div>\
        <div class="lang-switch">\
          <a class="lang-btn ' + (currentLang === "fr" ? "active" : "") + '" href="#fr" data-lang="fr" data-id="' + a.id + '">🇫🇷 Français</a>\
          <a class="lang-btn ' + (currentLang === "en" ? "active" : "") + '" href="#en" data-lang="en" data-id="' + a.id + '">🇺🇸 English</a>\
        </div>\
      ';
      listEl.appendChild(articleEl);
      loadArticle(a, currentLang);
    });
    // wire lang switch buttons
    listEl.querySelectorAll(".lang-btn").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        var lang = btn.getAttribute("data-lang");
        var id = btn.getAttribute("data-id");
        currentLang = lang;
        render();
      });
    });
  }

  function loadArticle(a, lang) {
    var url = (lang === "en" && a.en) ? a.en : a.fr;
    var contentEl = document.getElementById("content-" + a.id);
    var labelEl = document.getElementById("lang-label-" + a.id);
    fetch(url).then(function (r) {
      if (!r.ok) throw new Error("not found");
      return r.text();
    }).then(function (md) {
      contentEl.innerHTML = markdownToHtml(md);
      if (labelEl) {
        var orig = (lang === "en") ? "Original en français" : "Version anglaise (traduite)";
        labelEl.textContent = orig;
      }
    }).catch(function () {
      contentEl.textContent = "Article non disponible dans cette langue.";
    });
  }

  function escapeHtml(t) {
    return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function markdownToHtml(md) {
    // extraction du frontmatter YAML
    var front = "";
    var body = md;
    var m = md.match(/^---\s*\n([\s\S]*?)\n---\s*\n/);
    if (m) {
      front = m[1];
      body = md.slice(m[0].length);
    }
    var html = body
      .replace(/^# (.*$)/gmi, "<h1>$1</h1>")
      .replace(/^## (.*$)/gmi, "<h2>$1</h2>")
      .replace(/^### (.*$)/gmi, "<h3>$1</h3>")
      .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
      .replace(/\*(.*?)\*/g, "<em>$1</em>")
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>")
      .replace(/^- (.*$)/gmi, "<li>$1</li>")
      .replace(/\n\n/g, "</p><p>")
      .replace(/\n/g, "<br>");
    if (html.indexOf("<li>") !== -1) {
      html = html.replace(/(<li>.*<\/li>)/s, "<ul>$1</ul>");
    }
    html = "<p>" + html + "</p>";
    return html;
  }

  render();
})();
</script>
</body>
</html>
