<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    console.log('[SW] Registered:', reg.scope);
  }).catch(err => console.warn('[SW] Registration failed:', err));
}
</script>
<script src="./install.js"></script>
<script src="./refresh.js"></script>
<script>
(function () {
  var container = document.querySelector('.matrix-rain');
  if (!container) return;
  var width = window.innerWidth;
  var colCount = Math.ceil(width / 18);
  var codes = [
    { text: 'paralleluse', klass: 'vert' },
    { text: 'asynchronise', klass: 'bleu' },
    { text: 'async/await', klass: 'blanc' },
    { text: 'promise.all', klass: 'rouge' },
    { text: 'settimeout', klass: 'vert' },
    { text: 'event loop', klass: 'bleu' },
    { text: 'microtask', klass: 'vert' },
    { text: 'callback', klass: 'bleu' },
    { text: '<co>', klass: 'blanc' },
    { text: '<recyclor_data>', klass: 'rouge' },
    { text: '01', klass: 'blanc' },
    { text: 'kt-', klass: 'rouge' },
    { text: 'fetch', klass: 'vert' },
    { text: 'json', klass: 'bleu' },
    { text: 'dom', klass: 'blanc' },
    { text: 'api', klass: 'rouge' },
    { text: 'ws', klass: 'vert' },
    { text: 'socket', klass: 'bleu' },
    { text: 'port', klass: 'blanc' },
    { text: 'host', klass: 'rouge' },
    { text: 'dns', klass: 'vert' },
    { text: 'http', klass: 'bleu' },
    { text: 'ssl', klass: 'blanc' },
    { text: 'jwt', klass: 'rouge' },
    { text: 'css', klass: 'vert' },
    { text: 'html', klass: 'bleu' },
    { text: 'js', klass: 'blanc' },
    { text: 'git', klass: 'rouge' },
    { text: 'ci', klass: 'vert' },
    { text: 'cd', klass: 'bleu' },
    { text: 'aws', klass: 'blanc' },
    { text: 'linux', klass: 'rouge' },
    { text: 'web', klass: 'vert' },
    { text: 'app', klass: 'bleu' },
    { text: 'node', klass: 'blanc' },
    { text: 'npm', klass: 'rouge' }
  ];
  function randomCode() {
    var c = codes[Math.floor(Math.random() * codes.length)];
    return '<span class="matrix-code ' + c.klass + '">' + c.text + '</span>';
  }
  function buildColumn(left, delay, duration) {
    var col = document.createElement('div');
    col.className = 'matrix-col';
    col.style.left = left + 'px';
    col.style.animationDelay = delay + 's';
    col.style.animationDuration = duration + 's';
    var lines = Math.floor(3 + Math.random() * 7);
    var html = '';
    for (var i = 0; i < lines; i++) {
      html += randomCode();
    }
    col.innerHTML = html;
    return col;
  }
  for (var i = 0; i < colCount; i++) {
    var left = i * 40 + (Math.random() * 15);
    var delay = Math.random() * 30;
    var duration = 12 + Math.random() * 30;
    container.appendChild(buildColumn(left, delay, duration));
  }
  window.addEventListener('resize', function () {
    width = window.innerWidth;
    colCount = Math.ceil(width / 40);
    while (container.firstChild) container.removeChild(container.firstChild);
    for (var i = 0; i < colCount; i++) {
      var left = i * 40 + (Math.random() * 15);
      var delay = Math.random() * 30;
      var duration = 12 + Math.random() * 30;
      container.appendChild(buildColumn(left, delay, duration));
    }
  });
})();
</script>
</body>
</html>
