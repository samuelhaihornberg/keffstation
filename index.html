<script>
(function () {
  var container = document.querySelector('.matrix-rain');
  if (!container) return;
  var width = window.innerWidth;
  var colCount = Math.ceil(width / 18);
  var codes = [
    { text: '<A1➡️B2>', klass: 'vert' },
    { text: '<sandwich>', klass: 'bleu' },
    { text: '<adresse>', klass: 'blanc' },
    { text: '<cos>', klass: 'rouge' },
    { text: '<BLM>', klass: 'vert' },
    { text: '<BLSM>', klass: 'bleu' },
    { text: '<motor.s>', klass: 'blanc' },
    { text: '<CSM>', klass: 'rouge' },
    { text: '<connexion>', klass: 'vert' },
    { text: '<registre>', klass: 'bleu' },
    { text: '<nœud>', klass: 'blanc' },
    { text: '<graphe>', klass: 'rouge' },
    { text: '<cos-editor>', klass: 'vert' },
    { text: '<ViA>', klass: 'bleu' },
    { text: '<Golem>', klass: 'blanc' },
    { text: '<Geeko>', klass: 'rouge' },
    { text: '<Guideoplan>', klass: 'vert' },
    { text: '<SuperBots>', klass: 'bleu' },
    { text: '<KT->', klass: 'blanc' },
    { text: '<recyclor>', klass: 'rouge' }
  ];
  function randomCode() {
    var c = codes[Math.floor(Math.random() * codes.length)];
    return '<span class="matrix-code ' + c.klass + '">' + c.text + '</span>';
  }
  function buildColumn(left, delay, duration) {
    var col = document.createElement('div');
    col.className = 'matrix-col';
    col.style.left = left + 'px';
    col.style.animationDelay = delay + 's';
    col.style.animationDuration = duration + 's';
    var lines = Math.floor(1 + Math.random() * 3);
    var html = '';
    for (var i = 0; i < lines; i++) {
      html += randomCode();
    }
    col.innerHTML = html;
    return col;
  }
  var COL_SPACING = 160;
  var LINE_SPACING = 120;
  var colCount = Math.ceil(width / COL_SPACING) + 1;
  var lineCount = Math.ceil(window.innerHeight / LINE_SPACING) + 1;

  function randomLineCode() {
    var c = codes[Math.floor(Math.random() * codes.length)];
    return '<span class="matrix-line-code ' + c.klass + '">' + c.text + '</span>';
  }

  function buildLine(top, delay, duration) {
    var line = document.createElement('div');
    line.className = 'matrix-line';
    line.style.top = top + 'px';
    line.style.animationDelay = delay + 's';
    line.style.animationDuration = duration + 's';
    var count = Math.floor(2 + Math.random() * 5);
    var html = '';
    for (var i = 0; i < count; i++) {
      html += randomLineCode();
    }
    line.innerHTML = html;
    return line;
  }

  for (var i = 0; i < colCount; i++) {
    var left = i * COL_SPACING + (Math.random() * 40);
    var delay = Math.random() * 20;
    var duration = 10 + Math.random() * 15;
    var col = buildColumn(left, delay, duration);
    container.appendChild(col);
  }
  for (var i = 0; i < lineCount; i++) {
    var top = i * LINE_SPACING + (Math.random() * 30);
    var delay = Math.random() * 15;
    var duration = 8 + Math.random() * 12;
    var line = buildLine(top, delay, duration);
    container.appendChild(line);
  }

  window.addEventListener('resize', function () {
    width = window.innerWidth;
    colCount = Math.ceil(width / COL_SPACING) + 1;
    lineCount = Math.ceil(window.innerHeight / LINE_SPACING) + 1;
    while (container.firstChild) container.removeChild(container.firstChild);
    for (var i = 0; i < colCount; i++) {
      var left = i * COL_SPACING + (Math.random() * 40);
      var delay = Math.random() * 20;
      var duration = 10 + Math.random() * 15;
      var col = buildColumn(left, delay, duration);
      container.appendChild(col);
    }
    for (var i = 0; i < lineCount; i++) {
      var top = i * LINE_SPACING + (Math.random() * 30);
      var delay = Math.random() * 15;
      var duration = 8 + Math.random() * 12;
      var line = buildLine(top, delay, duration);
      container.appendChild(line);
    }
  });
})();
</script>
<script defer>
(function () {
  "use strict";
  var ENDPOINT = "https://qsibfydsqmrcnonwcbzn.supabase.co/functions/v1/clever-task";
  var MAX_BATCH = 25;
  var FLUSH_INTERVAL = 30000;
  var queue = [];
  var sessionId = null;
  var sending = false;

  function getSessionId() {
    if (!sessionId) {
      try { sessionId = sessionStorage.getItem("ks_session_id"); } catch (e) {}
      if (!sessionId) {
        try { sessionId = typeof crypto.randomUUID === "function" ? crypto.randomUUID() : Math.random().toString(36).slice(2); } catch (e) { sessionId = Math.random().toString(36).slice(2); }
        try { sessionStorage.setItem("ks_session_id", sessionId); } catch (e) {}
      }
    }
    return sessionId;
  }

  function isBot() {
    var ua = navigator.userAgent || "";
    return /bot|crawler|spider|slurp|bingpreview|headless|lighthouse|pagespeed|facebookexternalhit|whatsapp|telegrambot|semrush|ahrefs|mj12bot|dotbot|yandex/i.test(ua);
  }

  function cleanPath(value) {
    if (typeof value !== "string") return null;
    try {
      var url = new URL(value, "https://keffstation.invalid");
      return (url.pathname || "/").slice(0, 300);
    } catch (e) { return null; }
  }

  function cleanString(value, max) {
    if (typeof value !== "string") return null;
    var cleaned = value.replace(/[\u0000-\u001f\u007f]/g, "").trim();
    if (!cleaned) return null;
    return cleaned.slice(0, max || 200);
  }

  function deviceType() {
    var ua = navigator.userAgent || "";
    if (/Mobi|Android|iPhone|iPad/.test(ua)) return "mobile";
    if (/Tablet/.test(ua)) return "tablet";
    return "desktop";
  }

  function sendEvent(type, elementType, elementId, elementLabel, path, metadata) {
    if (isBot()) return;
    getSessionId();
    queue.push({
      type: type,
      sessionId: sessionId,
      occurredAt: new Date().toISOString(),
      path: path ? cleanPath(path) : null,
      deviceType: deviceType(),
      elementType: elementType || null,
      elementId: elementId ? cleanString(elementId, 80) : null,
      elementLabel: elementLabel ? cleanString(elementLabel, 80) : null,
      metadata: metadata || {}
    });
    if (queue.length >= MAX_BATCH) flush();
  }

  function flush() {
    if (sending || queue.length === 0) return;
    sending = true;
    var batch = queue.splice(0, MAX_BATCH);
    var payload = JSON.stringify({ events: batch });
    if (navigator.sendBeacon) {
      navigator.sendBeacon(ENDPOINT, payload);
      sending = false;
      return;
    }
    fetch(ENDPOINT, {
      method: "POST",
      body: payload,
      headers: { "Content-Type": "application/json; charset=utf-8" },
      keepalive: true
    }).then(function () { sending = false; }).catch(function () { sending = false; });
  }

  if (typeof document !== "undefined") {
    document.addEventListener("click", function (ev) {
      var target = ev.target;
      while (target && target !== document.body) {
        if (target.tagName === "A" || target.tagName === "BUTTON") {
          var elType = target.tagName === "A" ? "link" : "button";
          var label = (target.textContent || "").trim().slice(0, 80);
          var id = target.id || target.getAttribute("data-id") || "";
          var href = target.getAttribute("href") || "";
          sendEvent("click", elType, id, label, href ? cleanPath(href) : null);
          return;
        }
        target = target.parentElement;
      }
    }, { passive: true });
  }

  setInterval(flush, FLUSH_INTERVAL);
  if (typeof window !== "undefined") {
    window.addEventListener("beforeunload", flush);
    window.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") flush();
    });
  }

  window.ksAnalytics = { send: sendEvent, flush: flush };
})();
</script>
