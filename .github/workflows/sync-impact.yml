name: Sync Impact & Monitoring

# Synchronisation simplifiée : surveillance de l'état.
# Plus de catalogue Impact.com après le nettoyage des apps.
# Ce workflow déclenche simplement le déploiement.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Trigger monitoring
    runs-on: ubuntu-latest
    steps:
      - name: État actuel
        run: |
          echo "Applications actives : blogum, viartificial-labs, videogames"
          echo "Ancien sync Impact supprimé lors du nettoyage"

      - name: Déclencher le déploiement
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
            console.log('Deploy workflow déclenché suite à sync-impact.');