name: Collect Stats & Monitoring

# Collecte simplifiée : ce workflow surveille l'état du projet
# et déclenche les workflows nécessaires.
# Les sources GA4/Search Console ne sont plus configurées après le nettoyage.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    name: Monitor & Trigger
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier l'état du dépôt
        run: |
          echo "Branche : $(git branch --show-current)"
          echo "Dernier commit : $(git log -1 --format='%s')"
          echo "Fichiers restants :"
          ls -d */ | grep -E '^(blogum|viartificial-labs|videogames)' | tr -d '/'

      - name: Vérifier workflows
        run: |
          echo "Workflows GitHub Actions configurés :"
          ls .github/workflows/*.yml

      - name: Déclencher le déploiement
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
            console.log('Deploy workflow déclenché.');