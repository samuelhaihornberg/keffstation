name: Boutique Sync (Shopify + Impact)

# Met à jour kifftech/data/products.json à partir des catalogues Shopify et
# Impact.com. Les secrets ne quittent JAMAIS le runner : seul le résultat
# public (produits, prix, liens) est commité et publié.
#
# Secrets attendus (Settings > Secrets and variables > Actions) :
#   SHOPIFY_STORE_DOMAIN      ex. kifftech.myshopify.com
#   SHOPIFY_ADMIN_TOKEN       jeton Admin API (read_products) — recommandé
#   SHOPIFY_STOREFRONT_TOKEN  jeton Storefront PUBLIC (injecté au déploiement)
#   IMPACT_API_KEY / IMPACT_API_SECRET / IMPACT_CAMPAIGN_ID / IMPACT_BRAND_ID
#
# Plusieurs alias sont acceptés pour chaque valeur (voir tableau ci-dessous) :
# le premier secret non vide est utilisé. Sans secret, le catalogue local
# (25+ produits par rayon) reste affiché et le site fonctionne normalement.

on:
  schedule:
    - cron: '23 4 * * *'   # chaque jour à 04:23 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Forcer la synchronisation même si rien ne change'
        type: boolean
        default: false
  push:
    branches: ['main']
    paths:
      - 'scripts/sync-boutique.mjs'
      - '.github/workflows/boutique-sync.yml'

permissions:
  contents: write

concurrency:
  group: 'boutique-sync'
  cancel-in-progress: true

jobs:
  sync:
    name: Synchroniser le catalogue live
    runs-on: ubuntu-latest
    env:
      # --- Shopify : domaine de la boutique -------------------------------
      SHOPIFY_STORE_DOMAIN: >-
        ${{ secrets.SHOPIFY_STORE_DOMAIN || secrets.SHOPIFY_DOMAIN || secrets.SHOPIFY_SHOP_DOMAIN || secrets.SHOPIFY_SHOP || secrets.shopify_domain || secrets.SHOP_DOMAIN || secrets.SHOPIFY_MYSHOPIFY_DOMAIN }}
      # --- Shopify : jeton Admin API (serveur) -----------------------------
      SHOPIFY_ADMIN_TOKEN: >-
        ${{ secrets.SHOPIFY_ADMIN_TOKEN || secrets.SHOPIFY_ADMIN_API_TOKEN || secrets.SHOPIFY_PRIVATE_TOKEN || secrets.SHOPIFY_TOKEN || secrets.shopify_admin_token || secrets.shopify_token }}
      # --- Shopify : jeton Storefront public (navigateur) -------------------
      SHOPIFY_STOREFRONT_TOKEN: >-
        ${{ secrets.SHOPIFY_STOREFRONT_TOKEN || secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN || secrets.SHOPIFY_STOREFRONT || secrets.SHOPIFY_PUBLIC_TOKEN || secrets.shopify_storefront_token || secrets.STOREFRONT_TOKEN }}
      SHOPIFY_API_VERSION: >-
        ${{ secrets.SHOPIFY_API_VERSION || secrets.shopify_api_version }}
      # --- Impact.com -----------------------------------------------------
      IMPACT_API_KEY: >-
        ${{ secrets.IMPACT_API_KEY || secrets.IMPACT_KEY || secrets.IMPACT_APIKEY || secrets.impact_api_key || secrets.impact_key }}
      IMPACT_API_SECRET: >-
        ${{ secrets.IMPACT_API_SECRET || secrets.IMPACT_SECRET || secrets.IMPACT_API_PASSWORD || secrets.impact_api_secret || secrets.impact_secret }}
      IMPACT_CAMPAIGN_ID: >-
        ${{ secrets.IMPACT_CAMPAIGN_ID || secrets.IMPACT_CAMPAIGN || secrets.impact_campaign_id || secrets.impact_campaign }}
      IMPACT_BRAND_ID: >-
        ${{ secrets.IMPACT_BRAND_ID || secrets.IMPACT_BRAND || secrets.impact_brand_id || secrets.impact_brand }}
      # --- Site ------------------------------------------------------------
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
      DEFAULT_CURRENCY: ${{ vars.DEFAULT_CURRENCY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Diagnostic de la configuration
        env:
          A_SHOPIFY_DOMAIN_1: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          A_SHOPIFY_DOMAIN_2: ${{ secrets.SHOPIFY_DOMAIN }}
          A_SHOPIFY_DOMAIN_3: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          A_SHOPIFY_DOMAIN_4: ${{ secrets.shopify_domain }}
          A_SHOPIFY_ADMIN_1: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          A_SHOPIFY_ADMIN_2: ${{ secrets.SHOPIFY_TOKEN }}
          A_SHOPIFY_ADMIN_3: ${{ secrets.shopify_token }}
          A_SHOPIFY_STOREFRONT_1: ${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}
          A_SHOPIFY_STOREFRONT_2: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          A_SHOPIFY_STOREFRONT_3: ${{ secrets.SHOPIFY_PUBLIC_TOKEN }}
          A_IMPACT_KEY_1: ${{ secrets.IMPACT_API_KEY }}
          A_IMPACT_KEY_2: ${{ secrets.IMPACT_KEY }}
          A_IMPACT_KEY_3: ${{ secrets.impact_api_key }}
          A_IMPACT_SECRET_1: ${{ secrets.IMPACT_API_SECRET }}
          A_IMPACT_SECRET_2: ${{ secrets.IMPACT_SECRET }}
          A_IMPACT_SECRET_3: ${{ secrets.impact_api_secret }}
          A_IMPACT_CAMPAIGN_1: ${{ secrets.IMPACT_CAMPAIGN_ID }}
          A_IMPACT_CAMPAIGN_2: ${{ secrets.IMPACT_CAMPAIGN }}
          A_IMPACT_CAMPAIGN_3: ${{ secrets.impact_campaign_id }}
          A_IMPACT_BRAND_1: ${{ secrets.IMPACT_BRAND_ID }}
          A_IMPACT_BRAND_2: ${{ secrets.IMPACT_BRAND }}
          A_IMPACT_BRAND_3: ${{ secrets.impact_brand_id }}
          A_PAYPAL_1: ${{ secrets.PAYPAL_CLIENT_ID }}
          A_PAYPAL_2: ${{ secrets.paypal_secret_ID }}
        run: |
          echo "--- Secrets détectés (noms uniquement) ---"
          for v in $(env | grep -oE '^A_[A-Z0-9_]+' | sort); do
            if [ -n "${!v}" ]; then echo "  ✅ $v"; else echo "  ❌ $v"; fi
          done
          echo "--- Valeurs résolues ---"
          echo "  Shopify domaine    : ${SHOPIFY_STORE_DOMAIN:-ABSENT}"
          echo "  Shopify Admin      : ${SHOPIFY_ADMIN_TOKEN:+PRÉSENT}${SHOPIFY_ADMIN_TOKEN:-ABSENT}"
          echo "  Shopify Storefront : ${SHOPIFY_STOREFRONT_TOKEN:+PRÉSENT}${SHOPIFY_STOREFRONT_TOKEN:-ABSENT}"
          echo "  Impact clé API     : ${IMPACT_API_KEY:+PRÉSENT}${IMPACT_API_KEY:-ABSENT}"
          echo "  Impact secret API  : ${IMPACT_API_SECRET:+PRÉSENT}${IMPACT_API_SECRET:-ABSENT}"
          echo "  Impact campagne    : ${IMPACT_CAMPAIGN_ID:+PRÉSENT}${IMPACT_CAMPAIGN_ID:-ABSENT}"
          echo "  Impact marque      : ${IMPACT_BRAND_ID:+PRÉSENT}${IMPACT_BRAND_ID:-ABSENT}"
          echo "  Domaine public     : ${SITE_DOMAIN:-ABSENT}"

      - name: Synchroniser catalogue (Shopify + Impact)
        run: node scripts/sync-boutique.mjs

      - name: Publier le catalogue mis à jour
        run: |
          if git diff --quiet -- kifftech/data/products.json; then
            echo "Catalogue déjà à jour — aucun commit nécessaire."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kifftech/data/products.json
          git commit -m "chore(boutique): catalogue live Shopify + Impact ($(node -e "const d=require('./kifftech/data/products.json');console.log(d.counts.total)") produits)"
          git push origin HEAD:main
