name: Boutique Sync & Deploy

# Synchronisation simplifiée : déclenche le déploiement du site.
# Les secrets Shopify/Impact ne sont plus requis depuis le nettoyage des apps.
# Ce workflow se contente de déclencher le déploiement deploy.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Trigger deployment
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier l'état current
        run: |
          echo "Structure actuelle : blogum, viartificial-labs, videogames"
          echo "Workflow deploy prêt à être déclenché"

      - name: Déclencher le déploiement
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'deploy.yml',
                ref: 'main'
              });
              console.log('Deplaiement du site déclenché avec succès.');
            } catch (e) {
              console.log('Erreur déclenchement : ' + e.message);
            }