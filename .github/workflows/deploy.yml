name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject PayPal public client ID
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID || secrets.paypal_secret_ID }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const id = String(process.env.PAYPAL_CLIENT_ID || '').trim();
          const safe = /^[A-Za-z0-9_-]{10,200}$/.test(id);
          fs.writeFileSync(
            'kifftech/paypal-config.js',
            '// Généré au déploiement — Client ID public uniquement.\n' +
            'window.KIFFTECH_PAYPAL_CLIENT_ID=' + JSON.stringify(safe ? id : '') + ';\n'
          );
          console.log(safe
            ? 'PayPal : Client ID public injecté (' + id.length + ' caractères).'
            : 'PayPal : Client ID absent ou invalide — bouton désactivé.');
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify files exist
        run: |
          ls -la index.html kifftech/index.html vitrine.css kifftech/app.v2.js
          test -f index.html && echo "✅ index.html présent"
          test -f kifftech/index.html && echo "✅ kifftech/index.html présent"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
