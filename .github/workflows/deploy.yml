name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject PayPal public client ID
        env:
          PAYPAL_CLIENT_ID: >-
            ${{ secrets.PAYPAL_CLIENT_ID || secrets.paypal_secret_ID || secrets.PAYPAL_PUBLIC_CLIENT_ID || secrets.PAYPAL_SANDBOX_CLIENT_ID }}
          PAYPAL_BUTTONS: ${{ vars.PAYPAL_BUTTONS }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const id = String(process.env.PAYPAL_CLIENT_ID || '').trim();
          const safe = /^[A-Za-z0-9_-]{10,200}$/.test(id);
          // Boutons de paiement personnalises (style, financement, message).
          // Personnalisation : variable GitHub PAYPAL_BUTTONS (JSON) ou
          // edition directe de window.KIFFTECH_PAYPAL_BUTTONS apres generation.
          let buttons = {
            style: { shape: 'rect', color: 'gold', layout: 'vertical', label: 'paypal', height: 44 },
            funding: ['paypal'],
            message: { color: 'black', size: 12 },
            disableFunding: [],
          };
          const rawButtons = String(process.env.PAYPAL_BUTTONS || '').trim();
          if (rawButtons) {
            try { buttons = { ...buttons, ...JSON.parse(rawButtons) }; }
            catch (e) { console.log('PayPal : PAYPAL_BUTTONS JSON invalide, style par defaut conserve.'); }
          }
          fs.writeFileSync(
            'kifftech/paypal-config.js',
            '// Genere au deploiement par .github/workflows/deploy.yml — Client ID public uniquement.\n' +
            '// Boutons de paiement personnalises : modifiez window.KIFFTECH_PAYPAL_BUTTONS.\n' +
            'window.KIFFTECH_PAYPAL_CLIENT_ID=' + JSON.stringify(safe ? id : '') + ';\n' +
            'window.KIFFTECH_PAYPAL_BUTTONS=' + JSON.stringify(buttons, null, 2) + ';\n'
          );
          console.log(safe
            ? 'PayPal : Client ID public injecte (' + id.length + ' caracteres). Boutons : ' + JSON.stringify(buttons.style) + ' | financement : ' + buttons.funding.join(', ') + '.'
            : 'PayPal : Client ID absent ou invalide — bouton desactive.');
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify files exist
        run: |
          ls -la index.html kifftech/index.html vitrine.css kifftech/app.v2.js
          test -f index.html && echo "✅ index.html présent"
          test -f kifftech/index.html && echo "✅ kifftech/index.html présent"

      - name: Preparer l'artefact (alleger)
        run: |
          # header.mp4 (7,3 Mo) n'est pas servi par le site : il est charge
          # depuis raw.githubusercontent. On le retire de l'artefact pour rester
          # sous la limite de temps du deploiement Pages.
          rm -f header.mp4
          echo "Taille de l'artefact : $(du -sh --exclude=.git . | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          # GitHub plafonne ce delai a 10 minutes ; en cas de depassement
          # (syncing_files), une seconde tentative est faite juste apres.
          timeout: 600000

      - name: Deploy to GitHub Pages (2e tentative)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
