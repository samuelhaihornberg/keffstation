name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject PayPal public client ID
        env:
          PAYPAL_CLIENT_ID: >-
            ${{ secrets.PAYPAL_CLIENT_ID || secrets.paypal_secret_ID || secrets.PAYPAL_PUBLIC_CLIENT_ID || secrets.PAYPAL_SANDBOX_CLIENT_ID }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const id = String(process.env.PAYPAL_CLIENT_ID || '').trim();
          const safe = /^[A-Za-z0-9_-]{10,200}$/.test(id);
          fs.writeFileSync(
            'kifftech/paypal-config.js',
            '// Généré au déploiement — Client ID public uniquement.\n' +
            'window.KIFFTECH_PAYPAL_CLIENT_ID=' + JSON.stringify(safe ? id : '') + ';\n'
          );
          console.log(safe
            ? 'PayPal : Client ID public injecté (' + id.length + ' caractères).'
            : 'PayPal : Client ID absent ou invalide — bouton désactivé.');
          NODE

      - name: Injecter la configuration Shopify publique (Storefront)
        env:
          SHOPIFY_STORE_DOMAIN: >-
            ${{ secrets.SHOPIFY_ID || secrets.SHOPIFY_STORE_DOMAIN || secrets.SHOPIFY_DOMAIN || secrets.SHOPIFY_SHOP_DOMAIN || secrets.shopify_domain }}
          SHOPIFY_TOKEN: >-
            ${{ secrets.SHOPIFY_KEY || secrets.SHOPIFY_STOREFRONT_TOKEN || secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_API_VERSION: >-
            ${{ secrets.SHOPIFY_API_VERSION || secrets.shopify_api_version }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          DEFAULT_CURRENCY: ${{ vars.DEFAULT_CURRENCY }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const raw = String(process.env.SHOPIFY_STORE_DOMAIN || '').trim()
            .replace(/^https?:\/\//, '').replace(/\/$/, '');
          // Normalisation : "kifftech" -> "kifftech.myshopify.com"
          let domain = raw;
          if (domain && !/\.myshopify\.com$/i.test(domain)) {
            const clean = domain.replace(/[^a-z0-9-]/gi, '').toLowerCase();
            domain = /^\d+$/.test(clean) ? '' : (clean ? clean + '.myshopify.com' : '');
          }
          const token = String(process.env.SHOPIFY_TOKEN || '').trim();
          const apiVersion = String(process.env.SHOPIFY_API_VERSION || '2024-10').trim();
          const siteDomain = String(process.env.SITE_DOMAIN || '').trim();
          const currency = String(process.env.DEFAULT_CURRENCY || 'EUR').trim();
          const domainOk = /^[a-z0-9-]+\.myshopify\.com$/i.test(domain);
          // Un jeton Admin API (shpat_...) ne doit JAMAIS etre expose dans le navigateur.
          const isAdminToken = /^shpat_/i.test(token);
          const tokenOk = !isAdminToken && /^[a-zA-Z0-9_-]{20,200}$/.test(token);
          const cfg = {
            domain: domainOk ? domain : '',
            storefrontAccessToken: tokenOk ? token : '',
            apiVersion,
            pageSize: 100,
            replaceLocalDb: false,
            currency,
            idPrefix: 'shopify-',
            siteDomain: siteDomain || '',
          };
          fs.writeFileSync(
            'kifftech/shopify-config.js',
            '// Généré au déploiement par .github/workflows/deploy.yml — jeton Storefront PUBLIC uniquement.\n' +
            '// Aucun secret : le jeton Admin API reste côté serveur.\n' +
            'window.KIFFTECH_SHOPIFY=' + JSON.stringify(cfg, null, 2) + ';\n'
          );
          if (domainOk && isAdminToken) {
            console.log('Shopify : domaine ' + domain + ' configuré. Jeton Admin API detecte -> NON injecte dans le navigateur (securite) ; les produits et les prix arrivent par le catalogue serveur.');
          } else if (domainOk) {
            console.log('Shopify : domaine ' + domain + ' configuré (jeton Storefront ' + (tokenOk ? 'present' : 'absent') + ').');
          } else {
            console.log('Shopify : domaine absent ou invalide — boutique en mode catalogue local.');
          }
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify files exist
        run: |
          ls -la index.html kifftech/index.html vitrine.css kifftech/app.v2.js
          test -f index.html && echo "✅ index.html présent"
          test -f kifftech/index.html && echo "✅ kifftech/index.html présent"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
